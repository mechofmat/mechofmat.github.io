    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6} a{color:inherit;text-decoration:none} .site-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.12)} .banner{width:100%;display:block;max-height:240px;object-fit:cover;object-position:center} .nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;background:rgba(15,76,129,.92)} .nav a{display:inline-block;padding:.95rem 1.1rem;color:rgba(255,255,255,.95);font-weight:600;border-radius:999px;margin:.35rem 0} .nav .active{background:var(--accent);color:#1a1a1a} .container{width:min(100% - 2rem,var(--max-width));margin:0 auto} .hero{text-align:center;padding:2.5rem 0 1.25rem} .page-title{margin:0;font-size:clamp(2rem,3vw,3rem);line-height:1.1;color:var(--primary-dark)} .subtitle{margin:.75rem auto 0;max-width:760px;color:var(--muted);font-size:1.03rem} .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:1.25rem 0 2rem} .card-body{padding:1.25rem} .event-date{display:inline-block;font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);background:rgba(15,76,129,.08);padding:.35rem .55rem;border-radius:999px;margin-bottom:.85rem} .event-location{margin:0 0 .65rem;font-size:1.02rem;font-weight:700} .event-title{margin:0;color:var(--muted)} .event-title a{color:var(--primary);font-weight:700} .link-list a{color:var(--primary);text-decoration:underline} .symposium-image{display:block;max-width:100%;height:auto;margin:1rem auto 0;border-radius:14px;box-shadow:0 10px 24px rgba(15,76,129,.12)} .footer-space{height:1.5rem} @media (max-width:720px){.nav a{padding:.8rem .95rem}.hero{padding-top:2rem}}
